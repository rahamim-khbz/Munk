<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munk's Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reader.css">
</head>
<body>
    <div id="toc-backdrop" class="toc-backdrop" onclick="toggleTOC()" style="position:fixed; inset:0; background:rgba(0,0,0,0.2); backdrop-filter:blur(4px); z-index:499; display:none;"></div>
    <nav id="toc-drawer" class="toc-drawer glass-panel">
        <div class="toc-header-bar"><span>Munk's Guide</span><button onclick="toggleTOC()">✕</button></div>
        <div class="toc-column-panel" style="padding: 24px 32px; border-bottom: 1px solid var(--border);">
            <select id="select-left-col" onchange="updateColumnSelectors()" style="width:100%; margin-bottom:12px; padding:10px; border-radius:10px;"><option value="en">English</option><option value="fr">French</option><option value="makbili">Hebrew</option></select>
            <select id="select-right-col" onchange="updateColumnSelectors()" style="width:100%; padding:10px; border-radius:10px;"><option value="en">English</option><option value="fr">French</option><option value="makbili" selected>Hebrew</option></select>
        </div>
        <div id="toc-body" class="toc-body"></div>
    </nav>
    <div class="main-container" data-left-col="en" data-right-col="makbili">
        <div class="header">
            <button onclick="toggleTOC()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--accent);">☰</button>
            <h1 id="main-title">Munk's Guide</h1>
            <div class="theme-controls">
                <button id="btn-light" class="theme-btn" onclick="setTheme('light')" style="background:#fdfcfb;"></button>
                <button id="btn-sepia" class="theme-btn" onclick="setTheme('sepia')" style="background:#f4ecd8;"></button>
                <button id="btn-dark" class="theme-btn" onclick="setTheme('dark')" style="background:#0f172a;"></button>
            </div>
        </div>
        <div class="content" id="chapter-content"></div>
    </div>
    <div id="fn-panel" class="fn-panel glass-panel">
        <div class="fn-panel-header"><span>Scholarly Annotation</span><button onclick="closeFnPanel()" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--accent-gold);">✕</button></div>
        <div id="fn-panel-body" class="fn-panel-body"></div>
    </div>
    <script src="js/reader.js"></script>
</body>
</html>
