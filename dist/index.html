<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munk's Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reader.css">
</head>
<body style="overflow-y:auto; height:auto; display:block;">
    <div class="content">
        <div class="toc-landing-page">
            <h1 class="landing-title">Salomon Munk's Guide for the Perplexed</h1>
            <div class="landing-subtitle">Digital Scholarly Experience</div>
            <div id="landing-grid" class="landing-grid"></div>
        </div>
    </div>
    <script>
        fetch('data/chapters.json').then(r => r.json()).then(chapters => {
            const grid = document.getElementById('landing-grid');
            const groups = { "Munk's Prefaces": [], "Introductions": [], "Part 1": [], "Part 2": [], "Part 3": [], "Munk's Endnotes": [] };
            chapters.forEach(ch => { if (groups[ch.category]) groups[ch.category].push(ch); });
            let html = '';
            for (const [name, list] of Object.entries(groups)) {
                if (list.length === 0) continue;
                html += `<div class="landing-section"><h3>${name}</h3><div class="landing-links">`;
                list.forEach(ch => { html += `<a href="reader.html?ch=${ch.slug}" class="glass-panel">${ch.title}</a>`; });
                html += '</div></div>';
            }
            grid.innerHTML = html;
        });
    </script>
</body>
</html>
