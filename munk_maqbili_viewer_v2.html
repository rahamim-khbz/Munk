<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munk & Maqbili Parallel Viewer</title>
    <link rel="stylesheet" href="viewer_styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-left">
            <button id="menu-btn" style="background:none; border:none; cursor:pointer; font-size: 20px;">☰</button>
            <button id="settings-btn" style="background:none; border:none; cursor:pointer; font-size: 20px;">⚙</button>
        </div>
        <div class="chapter-title">
            GUIDE FOR THE PERPLEXED - LETTER TO R. JOSEPH
        </div>
        <div class="header-right">
            <button id="prev-btn" style="background:none; border:none; cursor:pointer;">▲</button>
            <button id="next-btn" style="background:none; border:none; cursor:pointer;">▼</button>
        </div>
    </header>

    <main>
        <section class="column" id="munk-column">
            <div class="column-header">Salomon Munk (1856)</div>
            <div id="munk-content"></div>
        </section>
        <section class="column" id="maqbili-column">
            <div class="column-header">Maqbili Edition (2024)</div>
            <div id="maqbili-content"></div>
        </section>
    </main>

    <footer id="footnotes-footer">
        <h3>Footnotes</h3>
        <div id="footnotes-content"></div>
    </footer>

    <script>
        const MUNK_DATA = {
            "segments": {
                "Guide_for_the_Perplexed_Letter_to_R_Joseph_son_of_Judah.1": {
                    "english": "IN THE NAME OF THE ETERNAL, GOD OF THE UNIVERSE[^1]",
                    "footnotes": ["[1]: We have translated here the words אל עולם in the sense that Maimonides himself lends to them in several places..."]
                },
                "Guide_for_the_Perplexed_Letter_to_R_Joseph_son_of_Judah.2": {
                    "english": "When[^2], my dear disciple Rabbi Joseph[^3], son of R. Iehouda [may he rest in paradise!],",
                    "footnotes": [
                        "[2]: The verb כנת (كُنْتَ) which begins the sentence relates to the words עט׳ם שאנך...",
                        "[3]: See my aforementioned Notice on Joseph ben Iehouda..."
                    ]
                },
                "Guide_for_the_Perplexed_Letter_to_R_Joseph_son_of_Judah.3": {
                    "english": "you presented yourself at my home, having come from a distant land[^4] to follow my lessons, you were already very highly placed in my esteem because of your great passion for study, and because I had recognized in your poems a profound love for speculative things...",
                    "footnotes": ["[4]: Literally: from the extremities of the lands. Joseph had come from Sabta or Seuta..."]
                },
                "Guide_for_the_Perplexed_Letter_to_R_Joseph_son_of_Judah.4": {
                    "english": "but when God decreed the separation and you departed in another direction, these conferences revived in me an (old) resolution which had already weakened, and your absence induced me to compose this treatise which I have written for you and for those like you, however few they may be. I have made of it detached chapters, and all that shall have been put into writing will reach you successively wherever you may be. Fare you well.",
                    "footnotes": []
                }
            }
        };

        const MAQBILI_DATA = {
            "Guide_for_the_Perplexed_Letter_to_R_Joseph_son_of_Judah.1": "In the name of the Lord, God of the World.",
            "Guide_for_the_Perplexed_Letter_to_R_Joseph_son_of_Judah.2": "My dear student, Rabbi Joseph [may God preserve him], son of Rabbi Judah [may he rest in peace]:",
            "Guide_for_the_Perplexed_Letter_to_R_Joseph_son_of_Judah.3": "When you stood before me, having come from the ends of the earth to study under my guidance, your stature grew in my eyes due to your great diligence in study, and because I recognized in your poems a profound desire for speculative matters. This was already evident from the letters and Maqamat you sent me from Alexandria, even before I had tested your capacity for comprehension. I said to myself: 'Perhaps his desire is greater than his grasp.' But when you studied under my direction what you have already studied of astronomy, and the mathematics necessary as a preparation for it which you had learned previously, my joy in you increased because of your sound intellect and the quickness of your perception. I saw that your passion for mathematics was great, and I allowed you to train in it, knowing where it would lead you. And when you studied under my direction what you have already studied of the science of logic, I placed my hopes in you, and found you worthy of having the secrets of the prophetic books revealed to you, so that you might understand from them what is fitting for perfect individuals to understand. Therefore, I began to hint and provide you with subtle indications. Then I saw you seeking more from me, and urging me to explain matters of the divine sciences, and to inform you of the intentions of the 'Mutakallimun' (theologians), and whether their methods are demonstrative, and if not—to which discipline they belong.",
            "Guide_for_the_Perplexed_Letter_to_R_Joseph_son_of_Judah.4": "And when God decreed our separation and you turned to wherever you turned, these encounters moved me to a resolution that had previously weakened, and your absence prompted me to compose this work, which I have written for you and for those like you, few as they may be. I have arranged it in separate chapters, and each part that is written will reach you one by one wherever you may be, and may you be in peace."
        };

        function render() {
            const munkContainer = document.getElementById('munk-content');
            const maqbiliContainer = document.getElementById('maqbili-content');
            const footnoteContainer = document.getElementById('footnotes-content');
            
            let allFootnotes = [];

            Object.keys(MUNK_DATA.segments).forEach((id, index) => {
                const munk = MUNK_DATA.segments[id];
                const maqbili = MAQBILI_DATA[id] || "";

                // Munk Segment
                const munkDiv = document.createElement('div');
                munkDiv.className = 'segment';
                munkDiv.innerHTML = `<span class="segment-id">(${index + 1})</span> ${munk.english.replace(/\[\^(\d+)\]/g, '<sup class="footnote-marker">$1</sup>')}`;
                munkContainer.appendChild(munkDiv);

                // Maqbili Segment
                const maqbiliDiv = document.createElement('div');
                maqbiliDiv.className = 'segment';
                maqbiliDiv.innerHTML = `<span class="segment-id">(${index + 1})</span> ${maqbili}`;
                maqbiliContainer.appendChild(maqbiliDiv);

                // Collect Footnotes
                if (munk.footnotes) {
                    allFootnotes = allFootnotes.concat(munk.footnotes);
                }
            });

            // Render Footnotes
            allFootnotes.forEach(fn => {
                const fnDiv = document.createElement('div');
                fnDiv.className = 'footnote-item';
                fnDiv.textContent = fn;
                footnoteContainer.appendChild(fnDiv);
            });
        }

        render();
    </script>
</body>
</html>
